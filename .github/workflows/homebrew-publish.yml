name: Publish Homebrew Formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
  workflow_run:
    workflows: ['Publish to npm']
    types:
      - completed

jobs:
  update-formula:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve npm tarball
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          PACKAGE_URL=""

          for attempt in $(seq 1 30); do
            PACKAGE_URL="$(npm view "@involvex/youtube-music-cli@${VERSION}" dist.tarball --silent 2>/dev/null || true)"

            if [ -n "${PACKAGE_URL}" ] && curl --fail --location --silent --show-error "${PACKAGE_URL}" --output package.tgz; then
              echo "Downloaded npm tarball on attempt ${attempt}/30."
              break
            fi

            echo "NPM tarball not ready yet (attempt ${attempt}/30)."
            sleep 10
          done

          if [ ! -s package.tgz ] || [ -z "${PACKAGE_URL}" ]; then
            echo "Failed to resolve npm tarball for version ${VERSION} after 30 attempts."
            exit 1
          fi

          echo "PACKAGE_URL=${PACKAGE_URL}" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum package.tgz | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build Homebrew formula
        shell: bash
        run: |
          mkdir -p Formula
          cat > Formula/youtube-music-cli.rb <<EOF
          class YoutubeMusicCli < Formula
            desc "Terminal YouTube Music player"
            homepage "https://github.com/involvex/youtube-music-cli"
            url "${PACKAGE_URL}"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir[libexec/"bin/*"]
            end

            test do
              assert_match "youtube-music-cli", shell_output("#{bin}/youtube-music-cli --help")
            end
          end
          EOF

          if ! grep -Fq 'bin.install_symlink' Formula/youtube-music-cli.rb; then
            echo "Generated formula is missing bin.install_symlink (CLI will not be on PATH)."
            exit 1
          fi

      - name: Commit and push formula update
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- Formula/youtube-music-cli.rb; then
            echo "No formula changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/youtube-music-cli.rb
          git commit -m "chore(homebrew): update formula for ${TAG_NAME}"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "${{ github.event.repository.default_branch }}"
