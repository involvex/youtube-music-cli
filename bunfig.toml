# bunfig.toml — project-specific Bun settings
# https://bun.sh/docs/runtime/bunfig

[install]
registry = "https://registry.npmjs.org/"
global = false

[test]
# Isolate HOME so tests never touch the real ~/.youtube-music-cli
preload = ["./tests/setup.ts"]
coverage = false
parallel = true
watch = false

[run]
compat = "bun"
