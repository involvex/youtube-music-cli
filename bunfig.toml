# bunfig.toml — project-specific Bun settings
# https://bun.sh/docs/runtime/bunfig

[install]
registry = "https://registry.npmjs.org/"
global = false
auto = "auto"

[test]
# Isolate HOME so tests never touch the real ~/.youtube-music-cli
preload = ["./tests/setup.ts"]
coverage = false
parallel = true
watch = false

[run]
compat = "bun"
bun = true

[fmt]
sortImports = true
sortPackageJson = true
ignorePatterns = [
  "dist",
  "docs",
  "node_modules",
  "plugins",
  "scoop-bucket",
  ".claude",
  ".gemini",
  ".agent",
  ".agents",
  ".mcp",
  ".mira",
  ".kilo",
  ".kilocode",
]
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleAttributePerLine = true
singleQuote = false
trailingComma = "all"
bracketSpacing = true
arrowParens = "avoid"
